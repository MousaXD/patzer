name: Publish to Docker Hub

# Optional deployment for fork maintainers. The upstream project used this
# workflow to publish to its own Docker Hub namespace on every main push.
# A GitHub fork must not publish to that namespace by default or fail on
# missing secrets. Explicit opt-in requires PATZER_DOCKER_PUBLISH=true,
# PATZER_DOCKER_IMAGE=<your own Docker Hub image>, and credentials below.
# The normal CI workflow independently builds and boots the Docker image.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ vars.PATZER_DOCKER_PUBLISH == 'true' && vars.PATZER_DOCKER_IMAGE != '' }}
    runs-on: ubuntu-latest
    name: Build + push (Docker Hub)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.PATZER_DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Explicit opt-in builds linux/amd64. release.yml handles
          # separate multi-architecture GHCR publishing on tags.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
